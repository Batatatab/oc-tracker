name: ICAI Multi-Region Batch Checker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-all-regions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run All 5 Scrapers in Parallel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scraper_nirc.py &
          PID_NIRC=$!

          python scraper_wirc.py &
          PID_WIRC=$!

          python scraper_eirc.py &
          PID_EIRC=$!

          python scraper_sirc.py &
          PID_SIRC=$!

          python scraper_circ.py &
          PID_CIRC=$!

          # Wait for all regional scrapers to complete
          wait $PID_NIRC $PID_WIRC $PID_EIRC $PID_SIRC $PID_CIRC
          echo "All 5 regional scrapers completed execution."

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state or topic changes detected across any region."
          else
            git commit -m "Auto-update multi-region state & topic maps [skip ci]"
            git pull --rebase --autostash origin main || git pull --rebase origin main || true
            git push origin main || git push
          fi
