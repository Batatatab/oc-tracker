name: Check ICAI Batches

on:
  schedule:
    # 06:00 AM & 06:15 AM IST (00:30 & 00:45 UTC)
    - cron: '30,45 0 * * *'

    # Every 15 mins from 06:30 AM to 09:15 PM IST (01:00 to 15:45 UTC)
    - cron: '*/15 1-15 * * *'

    # 09:30 PM, 09:45 PM & 10:00 PM IST (16:00, 16:15 & 16:30 UTC)
    - cron: '0,15,30 16 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-all-regions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run All 5 Scrapers in Parallel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scraper_nirc.py &
          PID_NIRC=$!

          python scraper_wirc.py &
          PID_WIRC=$!

          python scraper_eirc.py &
          PID_EIRC=$!

          python scraper_sirc.py &
          PID_SIRC=$!

          python scraper_circ.py &
          PID_CIRC=$!

          # Wait for each regional scraper safely without aborting early on single-region failure
          wait $PID_NIRC || echo "NIRC exited with error code $?"
          wait $PID_WIRC || echo "WIRC exited with error code $?"
          wait $PID_EIRC || echo "EIRC exited with error code $?"
          wait $PID_SIRC || echo "SIRC exited with error code $?"
          wait $PID_CIRC || echo "CIRC exited with error code $?"

          echo "All 5 regional scrapers completed execution."

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state or topic changes detected across any region."
          else
            git commit -m "Auto-update multi-region state & topic maps [skip ci]"
            git pull --rebase --autostash origin main || git pull --rebase origin main || true
            git push origin main || git push
          fi
